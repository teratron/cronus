[package]
name = "cronus-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "cronus_tui"
path = "src/lib.rs"

[[bin]]
name = "cronus-tui"
path = "src/main.rs"

[dependencies]
cronus-contract = { workspace = true }
cronus-core = { workspace = true }
cronus-domain = { workspace = true }
crossterm = { workspace = true }
ratatui = { version = "0.30.2", default-features = false, features = [
    "crossterm_0_29",
] }

[dev-dependencies]
cronus-conformance = { workspace = true }
