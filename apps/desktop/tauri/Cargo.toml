[package]
name = "cronus-desktop"
version = "0.1.0"
description = "Cronus desktop application — Tauri v2 shell over the React UI"
edition = "2024"

[lib]
name = "cronus_desktop_lib"
# rlib only: the desktop binary links the lib statically. The mobile crate
# types (staticlib/cdylib) are re-added when mobile targets land — with the
# embedded core they overflow the windows-gnu 64K DLL export-ordinal limit.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# The embeddable core engine — the shell marshals IPC calls onto its
# capability surface and never re-implements domain logic.
cronus-core = { path = "../../../crates/core" }
# The shared wire vocabulary (Invocable/Invocation/Outcome/ArgValue) — the
# same direct dependency the CLI and TUI frontends already carry alongside
# cronus-core. "serde" is enabled here (and nowhere else in the main
# workspace) because this is the one frontend that actually crosses a
# process boundary; the feature is optional and off by default in the crate
# itself for exactly this reason.
cronus-contract = { path = "../../../crates/contract", features = ["serde"] }

[dev-dependencies]
# The shared conformance corpus, linked from outside the main `crates/`
# workspace for the first time — the corpus is shaped as a library rather
# than one central suite specifically so a detached workspace could pull it
# in; this shell's own detached workspace has never proven it can until now.
# Test-only: never affects the shipped binary's own dependency graph.
cronus-conformance = { path = "../../../crates/conformance" }

# Detach from the repo's Rust workspace (crates/*): the desktop shell builds
# independently of the core engine workspace and must not pull webview deps into it.
[workspace]
