packages:
  - "packages/*"
  - "apps/*"

# Single source of truth for versions shared across packages/ui and apps/desktop.
# Each package references these with the `catalog:` protocol, so a version can
# never drift between the shared UI library and the app that consumes it.
catalog:
  react: ^19.2.8
  react-dom: ^19.2.8
  typescript: ^7.0.2
  vite: ^8.2.2
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.6
  "@vitejs/plugin-react": ^6.1.1

minimumReleaseAgeExclude:
  - vite@8.2.2
  - '@fallow-cli/darwin-arm64@3.20.0 || 3.22.0'
  - '@fallow-cli/darwin-x64@3.20.0 || 3.22.0'
  - '@fallow-cli/linux-arm64-gnu@3.20.0 || 3.22.0'
